[project]
name = "sov-bonus"
version = "0.1.0"
description = "Локальный прототип расчёта бонусов СОВ на условных данных"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["m1: приёмочные проверки движка, реализация на этапе M1"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "app/**/*.py", "tests/test_*.py", "tests/conftest.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
